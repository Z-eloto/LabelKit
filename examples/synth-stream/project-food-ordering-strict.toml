# project-food-ordering-strict.toml - 点餐、外卖、到店点单、自提场景时间流生成
# 每帧包含 event + accessor 所需的扁平字段；app_usage 在每个序列中必然出现。
# event/accessor 严格递增需在导出时启用 export_stream_views.py --calibrate-timestamps。
schema_version = 1

[run]
output = "./out/synth-food-ordering-strict.jsonl"
modality = "text"
mode = "generate_only"
batch_size = 8
seed = 20260820

[input]
text_field = "text"

[stream]
order_by = "meta:ts"
gap_s = 900

[dedup]
enabled = true

[generate]
enabled = true
llms = ["default"]
num_per_call = 4
temperature = 0.9

[generate.stream]
enabled = true
sessions = 10
noise_ratio = 0
noise_instruction = """
生成与点餐、外卖、自提和到店就餐无关的干扰输入，例如查看天气、浏览新闻或短暂切换应用。
长度 5–15 字，内容自然，但不能包含餐品、商家、下单、配送、取餐或支付等关键信息。
"""
duplicates = 1
frame_gap_s = [5, 60]
ts_start = "2026-01-05T11:00:00+08:00"

# 四个等权档位逐步增加购物证据；每档都包含 app_usage。
# sequences=10 时按最大余额法分配为 3、3、2、2 条。
[[generate.stream.tiers]]
tier_rank = 1
weight = 1
frame_classes = ["app_usage"]

[[generate.stream.tiers]]
tier_rank = 2
weight = 1
frame_classes = ["paste_board", "app_usage"]

[[generate.stream.tiers]]
tier_rank = 3
weight = 1
frame_classes = ["notification", "paste_board", "app_usage"]

[[generate.stream.tiers]]
tier_rank = 4
weight = 1
frame_classes = ["notification", "paste_board", "companion_memory", "screen_memory", "app_usage"]

[classify]
enabled = true

[[classify.classes]]
name = "food_order"
description = "用户通过外卖、餐饮品牌或支付 App 完成配送、自提或到店点餐"

[class.food_order.generate]
instruction = """
为同一次完整点餐流程生成连贯的屏幕操作快照序列，场景可为外卖配送、到店点单、
自提取餐或餐厅就餐。流程从打开下单 App、浏览商家与菜单开始，经选择餐品、确认履约
方式和订单、支付，推进到订单确认、配送或取餐通知。

每个序列选择一个主下单 App，并在下单相关帧中保持一致：美团(com.sankuai.hmeituan)、
美团外卖(com.meituan.takeaway)、淘宝闪购/饿了么(me.ele.eleme)、
肯德基(com.yumc.kfc.superapp)或麦当劳(com.mcdonalds.cma.hm)。支付阶段可切换到
微信(com.tencent.mm)、支付宝(com.alipay.mobile.client)或云闪付(com.unionpay.hmos.wallet)。
支付 App 只能出现在支付相关帧，不能替代主下单 App。商家、餐品、履约方式和订单状态
必须前后一致；每帧使用自然中文描述并推动同一订单流程。
"""
sequences = 10
len_range = [5, 6]

[class.food_order.annotate]
instruction = """
你是点餐会话标注员。阅读完整序列并抽取：
- behaviorType：固定为 "food_ordering"
- confidence：抽取置信度，0 到 1
- bundleName：与本次点餐意图直接对应的 App 包名，只能是美团
  (com.sankuai.hmeituan)、美团外卖(com.meituan.takeaway)、淘宝闪购/饿了么
  (me.ele.eleme)、肯德基(com.yumc.kfc.superapp)、麦当劳(com.mcdonalds.cma.hm)、
  微信(com.tencent.mm)、支付宝(com.alipay.mobile.client)或云闪付
  (com.unionpay.hmos.wallet)
- actionInfo：
  - brandName：商家或门店名，开集非空字符串，例如 "KFC"
  - items：本次订单中的餐品或套餐描述数组，至少一项，例如 ["板烧鸡腿堡套餐"]
  - fulfillmentMode："delivery"（配送）、"pickup"（自提）或 "dine_in"（餐厅就餐）
  - timestamp：与本次点餐行为对应的 app_usage 帧的 timestamp（13位毫秒时间戳）；
    如果序列中存在多个 app_usage 帧，取 timestamp 最早的一个
不要输出未声明字段。
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "behaviorType": {"type": "string", "const": "food_ordering"},
    "confidence": {"type": "number", "minimum": 0, "maximum": 1},
    "bundleName": {"type": "string", "enum": ["com.sankuai.hmeituan", "com.meituan.takeaway", "me.ele.eleme", "com.yumc.kfc.superapp", "com.mcdonalds.cma.hm", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "actionInfo": {
      "type": "object",
      "properties": {
        "brandName": {"type": "string", "minLength": 1, "description": "商家或门店名，开集字符串"},
        "items": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}, "description": "餐品或套餐描述数组"},
        "fulfillmentMode": {"type": "string", "enum": ["delivery", "pickup", "dine_in"]},
        "timestamp": {"type": "integer", "description": "对应最早 app_usage 帧的13位毫秒时间戳"}
      },
      "required": ["brandName", "items", "fulfillmentMode", "timestamp"],
      "additionalProperties": false
    }
  },
  "required": ["behaviorType", "confidence", "bundleName", "actionInfo"],
  "additionalProperties": false
}
"""

# ── 帧类表 ────────────────────────────────────────────────────────────────
[[frame.classify.classes]]
name = "notification"
description = "点餐通知：订单确认、配送进度、自提取餐或优惠提醒"

[[frame.classify.classes]]
name = "paste_board"
description = "点餐剪贴板：优惠码、地址、餐品名或订单信息"

[[frame.classify.classes]]
name = "companion_memory"
description = "同伴记忆：点餐、订单或支付页面截图分析"

[[frame.classify.classes]]
name = "screen_memory"
description = "屏幕记忆：点餐流程中的屏幕内容分析"

[[frame.classify.classes]]
name = "app_usage"
description = "点餐主 App 或支付 App 的使用区间"

# ── 按帧类的内容契约 ──────────────────────────────────────────────────────
[frame.class.notification.generate]
instruction = """
产出点餐通知快照帧：
- dataName：固定为 "notificationEvent"
- messageTime：通知产生的13位毫秒时间戳
- content：订单确认、商家接单、配送进度、到店就餐或自提取餐提醒
- appName：与 bundleName 对应的应用名称
- bundleName：通知内容必须与应用职责一致，只能从以下完整闭集中选择
- timestamp：与 messageTime 相同的13位毫秒时间戳
点餐 App：美团(com.sankuai.hmeituan)、美团外卖(com.meituan.takeaway)、
淘宝闪购/饿了么(me.ele.eleme)、肯德基(com.yumc.kfc.superapp)、
麦当劳(com.mcdonalds.cma.hm)。支付 App：微信(com.tencent.mm)、
支付宝(com.alipay.mobile.client)、云闪付(com.unionpay.hmos.wallet)。
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "dataName": {"type": "string", "const": "notificationEvent"},
    "messageTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "content": {"type": "string", "minLength": 1},
    "appName": {"type": "string", "minLength": 1},
    "bundleName": {"type": "string", "enum": ["com.sankuai.hmeituan", "com.meituan.takeaway", "me.ele.eleme", "com.yumc.kfc.superapp", "com.mcdonalds.cma.hm", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "timestamp": {"type": "integer"}
  },
  "required": ["dataName", "messageTime", "content", "appName", "bundleName", "timestamp"],
  "additionalProperties": false
}
"""

[frame.class.paste_board.generate]
instruction = """
产出点餐剪贴板快照帧：
- dataName：固定为 "pasteBoardEvent"
- timestamp：13位毫秒时间戳
- content：优惠码、收货地址、餐品名、门店名或订单号等与同一订单有关的内容
- sourceApp：内容来源 App 包名，只能是美团(com.sankuai.hmeituan)、美团外卖
  (com.meituan.takeaway)、淘宝闪购/饿了么(me.ele.eleme)、肯德基
  (com.yumc.kfc.superapp)、麦当劳(com.mcdonalds.cma.hm)、微信(com.tencent.mm)、
  支付宝(com.alipay.mobile.client)或云闪付(com.unionpay.hmos.wallet)
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "dataName": {"type": "string", "const": "pasteBoardEvent"},
    "timestamp": {"type": "integer", "description": "13位毫秒时间戳"},
    "content": {"type": "string", "minLength": 1},
    "sourceApp": {"type": "string", "enum": ["com.sankuai.hmeituan", "com.meituan.takeaway", "me.ele.eleme", "com.yumc.kfc.superapp", "com.mcdonalds.cma.hm", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]}
  },
  "required": ["dataName", "timestamp", "content", "sourceApp"],
  "additionalProperties": false
}
"""

[frame.class.companion_memory.generate]
instruction = """
产出点餐同伴记忆快照帧：
- dataName：固定为 "companionMemoryEvent"
- createTime：截图创建时间，13位毫秒时间戳
- updateTime：分析完成时间，13位毫秒时间戳，不能早于 createTime
- caption：商家、菜单、购物车、订单确认或支付页面摘要，必须与同一订单一致
- bundleName：必须与 caption 对应，只能是美团(com.sankuai.hmeituan)、美团外卖
  (com.meituan.takeaway)、淘宝闪购/饿了么(me.ele.eleme)、肯德基
  (com.yumc.kfc.superapp)、麦当劳(com.mcdonalds.cma.hm)、微信(com.tencent.mm)、
  支付宝(com.alipay.mobile.client)或云闪付(com.unionpay.hmos.wallet)
- status："Init" 或 "Finish"
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "dataName": {"type": "string", "const": "companionMemoryEvent"},
    "createTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "updateTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "caption": {"type": "string", "minLength": 1},
    "bundleName": {"type": "string", "enum": ["com.sankuai.hmeituan", "com.meituan.takeaway", "me.ele.eleme", "com.yumc.kfc.superapp", "com.mcdonalds.cma.hm", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "status": {"type": "string", "enum": ["Init", "Finish"]}
  },
  "required": ["dataName", "createTime", "updateTime", "caption", "bundleName", "status"],
  "additionalProperties": false
}
"""

[frame.class.screen_memory.generate]
instruction = """
产出点餐屏幕记忆快照帧：字段与 companion_memory 一致，caption 描述当前点餐或支付页面。
bundleName 必须与页面内容相符，只能是美团(com.sankuai.hmeituan)、美团外卖
(com.meituan.takeaway)、淘宝闪购/饿了么(me.ele.eleme)、肯德基
(com.yumc.kfc.superapp)、麦当劳(com.mcdonalds.cma.hm)、微信(com.tencent.mm)、
支付宝(com.alipay.mobile.client)或云闪付(com.unionpay.hmos.wallet)。
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "dataName": {"type": "string", "const": "screenMemoryEvent"},
    "createTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "updateTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "caption": {"type": "string", "minLength": 1},
    "bundleName": {"type": "string", "enum": ["com.sankuai.hmeituan", "com.meituan.takeaway", "me.ele.eleme", "com.yumc.kfc.superapp", "com.mcdonalds.cma.hm", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "status": {"type": "string", "enum": ["Init", "Finish"]}
  },
  "required": ["dataName", "createTime", "updateTime", "caption", "bundleName", "status"],
  "additionalProperties": false
}
"""

[frame.class.app_usage.generate]
instruction = """
产出点餐 App 使用快照帧：
- dataName：固定为 "appUsageEvent"
- timestamp：13位毫秒时间戳
- bundleName：只能是美团(com.sankuai.hmeituan)、美团外卖(com.meituan.takeaway)、
  淘宝闪购/饿了么(me.ele.eleme)、肯德基(com.yumc.kfc.superapp)、麦当劳
  (com.mcdonalds.cma.hm)、微信(com.tencent.mm)、支付宝(com.alipay.mobile.client)
  或云闪付(com.unionpay.hmos.wallet)；主下单 App 先于可选支付 App 出现
- state："IN" 或 "OUT"
- startTime：App 使用开始时间，13位毫秒时间戳
- duration：使用时长（毫秒），必须大于0
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "dataName": {"type": "string", "const": "appUsageEvent"},
    "timestamp": {"type": "integer", "description": "13位毫秒时间戳"},
    "bundleName": {"type": "string", "enum": ["com.sankuai.hmeituan", "com.meituan.takeaway", "me.ele.eleme", "com.yumc.kfc.superapp", "com.mcdonalds.cma.hm", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "state": {"type": "string", "enum": ["IN", "OUT"]},
    "startTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "duration": {"type": "integer", "minimum": 1000, "description": "使用时长（毫秒）"}
  },
  "required": ["dataName", "timestamp", "bundleName", "state", "startTime", "duration"],
  "additionalProperties": false
}
"""

[quality]
enabled = true
mode = "pointwise"
llm = "default"
threshold = 0.3

[annotate]
enabled = true
llm = "default"
instruction = """
你是点餐会话标注员。输出 behaviorType、confidence、bundleName 和 actionInfo。
behaviorType 固定为 "food_ordering"；actionInfo 仅包含 brandName、items、
fulfillmentMode 和 timestamp；timestamp 必须取本序列最早 app_usage 帧的13位毫秒时间戳。
bundleName 只能是美团(com.sankuai.hmeituan)、美团外卖(com.meituan.takeaway)、
淘宝闪购/饿了么(me.ele.eleme)、肯德基(com.yumc.kfc.superapp)、麦当劳
(com.mcdonalds.cma.hm)、微信(com.tencent.mm)、支付宝(com.alipay.mobile.client)
或云闪付(com.unionpay.hmos.wallet)。不要输出未声明字段。
"""

[verify]
enabled = false

[output]
meta_mode = "inline"
rejects = "refs"
schema_inline = """
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "type": "object",
  "properties": {
    "behaviorType": {"type": "string", "const": "food_ordering"},
    "confidence": {"type": "number", "minimum": 0, "maximum": 1},
    "bundleName": {"type": "string", "enum": ["com.sankuai.hmeituan", "com.meituan.takeaway", "me.ele.eleme", "com.yumc.kfc.superapp", "com.mcdonalds.cma.hm", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "actionInfo": {
      "type": "object",
      "properties": {
        "brandName": {"type": "string", "minLength": 1},
        "items": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}},
        "fulfillmentMode": {"type": "string", "enum": ["delivery", "pickup", "dine_in"]},
        "timestamp": {"type": "integer", "description": "对应最早 app_usage 帧的13位毫秒时间戳"}
      },
      "required": ["brandName", "items", "fulfillmentMode", "timestamp"],
      "additionalProperties": false
    }
  },
  "required": ["behaviorType", "confidence", "bundleName", "actionInfo"],
  "additionalProperties": false
}
"""

[trace]
enabled = true
channels = ["schema", "llm"]
content = "refs"
