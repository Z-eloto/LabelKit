# project-grocery-purchase-strict.toml - 买菜、商超补货、一键下单或帮买场景时间流生成
# 每帧包含 event + accessor 所需的扁平字段；app_usage 在每个序列中必然出现。
# event/accessor 严格递增需在导出时启用 export_stream_views.py --calibrate-timestamps。
schema_version = 1

[run]
output = "./out/synth-grocery-purchase-strict.jsonl"
modality = "text"
mode = "generate_only"
batch_size = 8
seed = 20260821

[input]
text_field = "text"

[stream]
order_by = "meta:ts"
gap_s = 900

[dedup]
enabled = true

[generate]
enabled = true
llms = ["default"]
num_per_call = 4
temperature = 0.9

[generate.stream]
enabled = true
sessions = 10
noise_ratio = 0
noise_instruction = """
生成与买菜、商超补货、商品下单和支付无关的干扰输入，例如查看天气或浏览新闻。
长度 5–15 字，内容自然，但不能包含商品、购物清单、商超、配送、下单或支付等关键信息。
"""
duplicates = 1
frame_gap_s = [5, 60]
ts_start = "2026-01-05T17:00:00+08:00"

# 单一档位覆盖全部 5 类帧；每种帧在每个序列中至少出现一次，因而 app_usage 必然存在。
[[generate.stream.tiers]]
tier_rank = 1
weight = 1
frame_classes = [
  "notification",
  "paste_board",
  "companion_memory",
  "screen_memory",
  "app_usage",
]

[classify]
enabled = true

[[classify.classes]]
name = "grocery_purchase"
description = "用户买菜、商超补货、一键下单或请平台帮买日常商品"

[class.grocery_purchase.generate]
instruction = """
为同一次完整买菜或商超补货流程生成连贯的屏幕操作快照序列。流程从打开购物 App、
浏览或搜索商品开始，经选择蔬菜、生鲜、食品或日用品、确认购物车和配送订单、支付，
推进到商家接单、拣货或配送通知。商超、商品、配送方式和订单状态必须前后一致。

每个序列选择一个主购物 App：叮咚买菜(com.100mi.ddmc)、盒马(com.wudaokou.hippo_hmos)、
朴朴超市(com.pupu.app)、美团买菜/小象超市(com.meituan.hmaicai)、
淘宝(com.taobao.taobao4hmos)、京东(com.jd.hm.mall)、天猫(com.tmall.tmall4hmos)、
拼多多(com.xunmeng.pinduoduo.hos)、淘宝特价版(com.taobao.litetao4harmony)或
阿里巴巴(com.alibaba.wireless_hmos)。支付阶段可切换到微信(com.tencent.mm)、
支付宝(com.alipay.mobile.client)或云闪付(com.unionpay.hmos.wallet)。支付 App 只能用于
支付相关帧，不能替代主购物 App。每帧使用自然中文描述并推动同一订单流程。
"""
sequences = 10
len_range = [5, 6]

[class.grocery_purchase.annotate]
instruction = """
你是买菜与商超购物会话标注员。阅读完整序列并抽取：
- behaviorType：固定为 "grocery_purchase"
- confidence：抽取置信度，0 到 1
- bundleName：与本次购物意图直接对应的 App 包名，只能是叮咚买菜(com.100mi.ddmc)、
  盒马(com.wudaokou.hippo_hmos)、朴朴超市(com.pupu.app)、美团买菜/小象超市
  (com.meituan.hmaicai)、淘宝(com.taobao.taobao4hmos)、京东(com.jd.hm.mall)、
  天猫(com.tmall.tmall4hmos)、拼多多(com.xunmeng.pinduoduo.hos)、淘宝特价版
  (com.taobao.litetao4harmony)、阿里巴巴(com.alibaba.wireless_hmos)、微信
  (com.tencent.mm)、支付宝(com.alipay.mobile.client)或云闪付(com.unionpay.hmos.wallet)
- actionInfo：
  - brandName：商超、菜场或平台名称，开集非空字符串，例如 "盒马"
  - items：本次订单中的商品描述数组，至少一项，例如 ["牛奶", "鸡蛋"]
  - fulfillmentMode：固定为 "delivery"（配送）
不要输出未声明字段。
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "behaviorType": {"type": "string", "const": "grocery_purchase"},
    "confidence": {"type": "number", "minimum": 0, "maximum": 1},
    "bundleName": {"type": "string", "enum": ["com.100mi.ddmc", "com.wudaokou.hippo_hmos", "com.pupu.app", "com.meituan.hmaicai", "com.taobao.taobao4hmos", "com.jd.hm.mall", "com.tmall.tmall4hmos", "com.xunmeng.pinduoduo.hos", "com.taobao.litetao4harmony", "com.alibaba.wireless_hmos", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "actionInfo": {
      "type": "object",
      "properties": {
        "brandName": {"type": "string", "minLength": 1, "description": "商超、菜场或平台名称，开集字符串"},
        "items": {"type": "array", "minItems": 1, "items": {"type": "string", "minLength": 1}, "description": "蔬菜、生鲜、食品或日用品描述数组"},
        "fulfillmentMode": {"type": "string", "const": "delivery", "description": "配送履约"}
      },
      "required": ["brandName", "items", "fulfillmentMode"],
      "additionalProperties": false
    }
  },
  "required": ["behaviorType", "confidence", "bundleName", "actionInfo"],
  "additionalProperties": false
}
"""

# ── 帧类表 ────────────────────────────────────────────────────────────────
[[frame.classify.classes]]
name = "notification"
description = "购物通知：订单确认、拣货、配送或优惠提醒"

[[frame.classify.classes]]
name = "paste_board"
description = "购物剪贴板：购物清单、优惠码、地址或订单信息"

[[frame.classify.classes]]
name = "companion_memory"
description = "同伴记忆：商品、购物车、订单或支付页面截图分析"

[[frame.classify.classes]]
name = "screen_memory"
description = "屏幕记忆：买菜或商超购物流程中的屏幕内容分析"

[[frame.classify.classes]]
name = "app_usage"
description = "主购物 App 或支付 App 的使用区间"

# ── 按帧类的内容契约 ──────────────────────────────────────────────────────
[frame.class.notification.generate]
instruction = """
产出买菜或商超购物通知快照帧：
- dataName：固定为 "notificationEvent"
- messageTime：通知产生的13位毫秒时间戳
- content：订单确认、商家接单、拣货、缺货替换、配送进度或优惠提醒
- appName：与 bundleName 对应的应用名称
- bundleName：通知内容必须与应用职责一致，只能从以下完整闭集中选择
- timestamp：与 messageTime 相同的13位毫秒时间戳
购物 App：叮咚买菜(com.100mi.ddmc)、盒马(com.wudaokou.hippo_hmos)、
朴朴超市(com.pupu.app)、美团买菜/小象超市(com.meituan.hmaicai)、
淘宝(com.taobao.taobao4hmos)、京东(com.jd.hm.mall)、天猫(com.tmall.tmall4hmos)、
拼多多(com.xunmeng.pinduoduo.hos)、淘宝特价版(com.taobao.litetao4harmony)、
阿里巴巴(com.alibaba.wireless_hmos)。支付 App：微信(com.tencent.mm)、
支付宝(com.alipay.mobile.client)、云闪付(com.unionpay.hmos.wallet)。
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "dataName": {"type": "string", "const": "notificationEvent"},
    "messageTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "content": {"type": "string", "minLength": 1},
    "appName": {"type": "string", "minLength": 1},
    "bundleName": {"type": "string", "enum": ["com.100mi.ddmc", "com.wudaokou.hippo_hmos", "com.pupu.app", "com.meituan.hmaicai", "com.taobao.taobao4hmos", "com.jd.hm.mall", "com.tmall.tmall4hmos", "com.xunmeng.pinduoduo.hos", "com.taobao.litetao4harmony", "com.alibaba.wireless_hmos", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "timestamp": {"type": "integer"}
  },
  "required": ["dataName", "messageTime", "content", "appName", "bundleName", "timestamp"],
  "additionalProperties": false
}
"""

[frame.class.paste_board.generate]
instruction = """
产出买菜或商超购物剪贴板快照帧：
- dataName：固定为 "pasteBoardEvent"
- timestamp：13位毫秒时间戳
- content：购物清单、商品名、优惠码、收货地址或订单号等同一订单相关内容
- sourceApp：内容来源 App 包名，只能是叮咚买菜(com.100mi.ddmc)、盒马
  (com.wudaokou.hippo_hmos)、朴朴超市(com.pupu.app)、美团买菜/小象超市
  (com.meituan.hmaicai)、淘宝(com.taobao.taobao4hmos)、京东(com.jd.hm.mall)、
  天猫(com.tmall.tmall4hmos)、拼多多(com.xunmeng.pinduoduo.hos)、淘宝特价版
  (com.taobao.litetao4harmony)、阿里巴巴(com.alibaba.wireless_hmos)、微信
  (com.tencent.mm)、支付宝(com.alipay.mobile.client)或云闪付(com.unionpay.hmos.wallet)
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "dataName": {"type": "string", "const": "pasteBoardEvent"},
    "timestamp": {"type": "integer", "description": "13位毫秒时间戳"},
    "content": {"type": "string", "minLength": 1},
    "sourceApp": {"type": "string", "enum": ["com.100mi.ddmc", "com.wudaokou.hippo_hmos", "com.pupu.app", "com.meituan.hmaicai", "com.taobao.taobao4hmos", "com.jd.hm.mall", "com.tmall.tmall4hmos", "com.xunmeng.pinduoduo.hos", "com.taobao.litetao4harmony", "com.alibaba.wireless_hmos", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]}
  },
  "required": ["dataName", "timestamp", "content", "sourceApp"],
  "additionalProperties": false
}
"""

[frame.class.companion_memory.generate]
instruction = """
产出买菜或商超购物同伴记忆快照帧：
- dataName：固定为 "companionMemoryEvent"
- createTime：截图创建时间，13位毫秒时间戳
- updateTime：分析完成时间，13位毫秒时间戳，不能早于 createTime
- caption：商品列表、商品详情、购物车、订单确认、配送或支付页面摘要
- bundleName：必须与 caption 对应，只能是叮咚买菜(com.100mi.ddmc)、盒马
  (com.wudaokou.hippo_hmos)、朴朴超市(com.pupu.app)、美团买菜/小象超市
  (com.meituan.hmaicai)、淘宝(com.taobao.taobao4hmos)、京东(com.jd.hm.mall)、
  天猫(com.tmall.tmall4hmos)、拼多多(com.xunmeng.pinduoduo.hos)、淘宝特价版
  (com.taobao.litetao4harmony)、阿里巴巴(com.alibaba.wireless_hmos)、微信
  (com.tencent.mm)、支付宝(com.alipay.mobile.client)或云闪付(com.unionpay.hmos.wallet)
- status："Init" 或 "Finish"
"""
schema_inline = """
{
  "type": "object",
  "properties": {
    "dataName": {"type": "string", "const": "companionMemoryEvent"},
    "createTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "updateTime": {"type": "integer", "description": "13位毫秒时间戳"},
    "caption": {"type": "string", "minLength": 1},
    "bundleName": {"type": "string", "enum": ["com.100mi.ddmc", "com.wudaokou.hippo_hmos", "com.pupu.app", "com.meituan.hmaicai", "com.taobao.taobao4hmos", "com.jd.hm.mall", "com.tmall.tmall4hmos", "com.xunmeng.pinduoduo.hos", "com.taobao.litetao4harmony", "com.alibaba.wireless_hmos", "com.tencent.mm", "com.alipay.mobile.client", "com.unionpay.hmos.wallet"]},
    "status": {"type": "string", "enum": ["Init", "Finish"]}
  },
  "required": ["dataName", "createTime", "updateTime", "caption", "bundleName", "status"],
  "additionalProperties": false
}
"""

[frame.class.screen_memory.generate]
