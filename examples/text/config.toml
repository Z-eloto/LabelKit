# Tool-level static config (spec §5.1) — z.ai Anthropic-compatible endpoint, glm-5.2 only.
schema_version = 1

[tool]
log_level = "info"
log_format = "text"

[llm.default]
provider = "openai_compatible"
base_url = "http://113.46.219.251:8080/v1"
model = "GLM-5.1"
api_key_env = "LK"
max_concurrency = 4
timeout_s = 120
max_retries = 5
supports_structured_output = true
supports_vision = true
max_output_tokens = 4096
context_window = 131072 # 端点实效保守值（V26）——P6 实测后可上调
temperature = 0.0

[llm.judge]
provider = "openai_compatible"
base_url = "http://113.46.219.251:8080/v1"
model = "GLM-5.1"
api_key_env = "LK"
max_concurrency = 4
timeout_s = 120
max_retries = 5
supports_structured_output = true
supports_vision = true
max_output_tokens = 2048
context_window = 131072 # 端点实效保守值（V26）——P6 实测后可上调
temperature = 0.0
